name: Go Build

permissions:
  contents: "read"

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        include:
          - os: ubuntu-latest
            output: ChatSettingsChecker
          - os: macos-latest
            output: ChatSettingsChecker
          - os: windows-latest
            output: ChatSettingsChecker.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.3"
      - name: Build
        run: go build -o ${{ matrix.output }} .
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChatSettingsChecker-${{ matrix.os }}
          path: ${{ matrix.output }}
  create-release:
    needs: [build]
    permissions:
      contents: "write"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout Code
        with:
          fetch-depth: 0 # allows for tags access
          persist-credentials: true # Required to update the nightly-build tag.

      # Windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download Windows
        with:
          name: ChatSettingsChecker-windows-latest
          path: release-artifacts/

      - name: Rename Windows Binary
        run: mv release-artifacts/ChatSettingsChecker.exe release-artifacts/ChatSettingsChecker-Windows.exe

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download Linux
        with:
          name: ChatSettingsChecker-ubuntu-latest
          path: release-artifacts/

      - name: Rename Linux Binary
        run: mv release-artifacts/ChatSettingsChecker release-artifacts/ChatSettingsChecker-Linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        name: Download Mac
        with:
          name: ChatSettingsChecker-macos-latest
          path: release-artifacts/

      - name: Rename Mac Binary
        run: mv release-artifacts/ChatSettingsChecker release-artifacts/ChatSettingsChecker-Mac

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build

      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash
